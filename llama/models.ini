; Router-режим llama-server: id модели = имя секции ("orchestrator").
; CLI-аргументы (compose command) имеют приоритет над ключами секции.
; ВАЖНО: путь к GGUF синхронизируйте с ORCHESTRATOR_MODEL_FILE в .env.

version = 1

[orchestrator]
model = /models/Huihui-Qwen3.8-27B-abliterated-UD-IQ4_XS.gguf
load-on-startup = true
